name: Douyin local integration
on:
  push:
    paths: ['packages/dsh-douyin-local/**', '.github/workflows/douyin-local.yml']
  pull_request:
    paths: ['packages/dsh-douyin-local/**', '.github/workflows/douyin-local.yml']
  workflow_dispatch:
jobs:
  offline:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: packages/dsh-douyin-local
      - run: npm test
        working-directory: packages/dsh-douyin-local
        env:
          DYC_INTEGRATION_PYTHON: python
