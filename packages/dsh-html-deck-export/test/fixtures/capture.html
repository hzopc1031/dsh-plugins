<html lang="zh"><meta charset="utf-8"><title>Capture engine fixture</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'Noto Sans CJK SC', sans-serif; display: flex; flex-direction: column; }
  canvas { position: fixed; inset: 0; z-index: -1; }
  #deck { flex: 1; display: grid; place-items: center; }
  #nav { height: 80px; flex-shrink: 0; background: red; }
</style>
<canvas id="background"></canvas>
<section id="deck" class="slide"><h1>清晰中文 · Full viewport</h1><img alt="Local asset" src="capture.svg"></section>
<nav id="nav">Must remain in flex layout</nav><div id="hint" style="position:fixed;top:0">Hint</div>
<script>
  const canvas = document.querySelector('canvas');
  canvas.width = innerWidth; canvas.height = innerHeight;
  requestAnimationFrame(() => {
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#123456'); gradient.addColorStop(1, '#78abcd');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
    window.backgroundPainted = true;
  });
</script></html>
