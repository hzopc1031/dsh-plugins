<!doctype html>

<html lang="zh-CN" data-medium="slide"><head><meta charset="utf-8"><title>Static pipeline contract</title>
<style>
html,body { margin:0; height:100%; font-family:'Noto Sans CJK SC',sans-serif }
body { display:flex; flex-direction:column }
canvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:-1 }
#deck { flex:1; min-height:0 }
.slide { width:100%; height:100%; color:white }
[data-anim] { opacity:.15; transform:translateX(30px) }
#nav { height:80px; flex-shrink:0; display:block; background:red }
#hint { position:fixed; top:0; right:0; color:red }
body.ppt-preview #nav, body.ppt-preview #hint { display:none!important }
</style></head><body>
<canvas class="bg" width="1920" height="1080"></canvas>
<main id="deck"><section class="slide" data-slide-id="pipeline" data-animate="pipeline">
<h1 data-anim="step">管线最终态</h1><p data-anim="step">所有步骤点亮</p>
</section></main>
<nav id="nav">导航不应进入截图</nav><div id="hint">提示</div>
<script>
if (new URLSearchParams(location.search).get('mode') === 'preview') document.body.classList.add('ppt-preview');
window.__currentSlideIndex = Number(new URLSearchParams(location.search).get('slide')) - 1;
window.__lowPowerMode = true;
window.__SPEAKER_NOTES__ = { pipeline: { points: ['第一行', '第二行'] } };
const ctx = document.querySelector('canvas').getContext('2d');
ctx.fillStyle = '#183657'; ctx.fillRect(0, 0, 1920, 1080);
const ready = document.fonts.ready.then(() => new Promise(resolve => setTimeout(() => {
  document.querySelectorAll('[data-anim]').forEach(node => { node.style.opacity = '.15' }); resolve(document.fonts);
}, 500)));
Object.defineProperty(document.fonts, 'ready', { value: ready });
</script></body></html>
